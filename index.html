<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>木工手機座設計與物理模擬平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#e7ebe6; --panel:#f4f6f2; --panel-2:#e3e8e2; --ink:#1d2824; --muted:#5f6d67; --line:#cfd7d0;
  --tape:#f2c230; --tape-ink:#1d2824; --chalk:#2d5bd7; --ok:#22894c; --bad:#cf3b2c; --warn:#c98a10;
  --stage:#dfe4df; --hud:rgba(244,246,242,.9); --focus:#2d5bd7;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a18; --panel:#1b2320; --panel-2:#232d29; --ink:#e3ebe6; --muted:#93a39c; --line:#2f3b36;
    --tape:#f2c230; --tape-ink:#141a18; --chalk:#7d9cff; --ok:#4cc27a; --bad:#ff6a59; --warn:#f0b13d;
    --stage:#18201d; --hud:rgba(27,35,32,.9); --focus:#7d9cff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a18; --panel:#1b2320; --panel-2:#232d29; --ink:#e3ebe6; --muted:#93a39c; --line:#2f3b36;
  --tape:#f2c230; --tape-ink:#141a18; --chalk:#7d9cff; --ok:#4cc27a; --bad:#ff6a59; --warn:#f0b13d;
  --stage:#18201d; --hud:rgba(27,35,32,.9); --focus:#7d9cff;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
.app{display:flex;width:100%;height:100%}
aside{width:340px;flex-shrink:0;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:20px 20px 32px}
main{flex:1;min-width:0;position:relative;background:var(--stage);overflow:hidden}
#stage-canvas{position:absolute;inset:0}
#stage-canvas canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage-canvas canvas:active{cursor:grabbing}

.brand{margin-bottom:18px}
.brand h1{font-size:21px;line-height:1.25;margin:0 0 4px;font-weight:900;letter-spacing:.01em}
.brand p{margin:0;color:var(--muted);font-size:12.5px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.btn{font:inherit;font-weight:700;font-size:13.5px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);padding:9px 10px;cursor:pointer;transition:background .15s,transform .05s}
.btn:hover{background:var(--panel-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.wide{grid-column:1/-1}
.btn.small{font-size:12.5px;padding:6px 10px;font-weight:500;border-width:1px;width:100%;margin-top:4px}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.sec{border-top:1px solid var(--line);padding:16px 0 6px}
.sec h2{font-size:14.5px;margin:0 0 10px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.sec h2 .step{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:11px;font-weight:700;transform:translateY(-1px)}

.ctl{margin-bottom:12px}
.ctl-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
.ctl-row label{font-size:13px;color:var(--ink)}
.ctl-row label sub{font-size:9px}
.val{display:flex;align-items:baseline;gap:3px;color:var(--muted);font-size:12px}
.val input{width:58px;font:inherit;font-size:13.5px;font-weight:700;color:var(--ink);text-align:right;background:transparent;border:none;border-bottom:1px dashed var(--muted);padding:1px 2px}
.val input::-webkit-inner-spin-button{opacity:.4}
.val em{font-style:normal;min-width:22px}
.hint-line{font-size:11.5px;color:var(--muted);margin:2px 0 0}

/* tape-measure slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:12px;border-radius:2px;background:
  repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 10%) 0 0/100% 5px no-repeat,
  repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 1px,transparent 1px 2%) 0 0/100% 3px no-repeat,
  var(--tape);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
input[type=range]::-moz-range-track{height:12px;border-radius:2px;background:
  repeating-linear-gradient(90deg,#1d2824 0 1px,transparent 1px 10%) 0 0/100% 5px no-repeat,
  repeating-linear-gradient(90deg,rgba(0,0,0,.45) 0 1px,transparent 1px 2%) 0 0/100% 3px no-repeat,
  var(--tape)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:6px;height:22px;margin-top:-5px;border-radius:2px;background:var(--bad);border:1.5px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:6px;height:22px;border-radius:2px;background:var(--bad);border:1.5px solid var(--panel)}

select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:2px 0 12px}
.seg button{flex:1;font:inherit;font-size:12.5px;padding:6px 4px;border:none;background:var(--panel-2);color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--ink);color:var(--panel);font-weight:700}
.derived{font-size:12.5px;background:var(--panel-2);border-radius:5px;padding:7px 10px;margin:-2px 0 12px;display:flex;justify-content:space-between;gap:8px}
.derived b{font-weight:700}
.derived.bad{color:var(--bad)}
.toggles label{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px;cursor:pointer}
.toggles input{accent-color:var(--ink);width:15px;height:15px}

#report .kv{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:12.5px;margin-bottom:10px}
#report .kv span:nth-child(odd){color:var(--muted)}
#report .kv span:nth-child(even){font-weight:700;text-align:right}
#report ul{list-style:none;padding:0;margin:0 0 8px}
#report li{display:flex;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
#report li i{font-style:normal;font-weight:900;width:16px;flex-shrink:0}
#report li.pass i{color:var(--ok)} #report li.fail i{color:var(--bad)}
#report li small{display:block;color:var(--muted);font-size:11.5px}
.verdict{font-weight:700;font-size:13px;padding:8px 10px;border-radius:5px;border-left:4px solid var(--ok);background:var(--panel-2)}
.verdict.fail{border-left-color:var(--bad)}
.flash{animation:flash 1.2s ease}
@keyframes flash{0%{background:rgba(242,194,48,.45)}100%{background:transparent}}

/* HUD */
.hud{position:absolute;z-index:2}
.views{top:14px;right:14px;display:flex;gap:6px}
.views button{font:inherit;font-size:12.5px;padding:6px 10px;border-radius:5px;border:1px solid var(--line);background:var(--hud);color:var(--ink);cursor:pointer;backdrop-filter:blur(6px)}
.views button:hover{border-color:var(--ink)}
.legend{top:14px;left:14px;background:var(--hud);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:12px;backdrop-filter:blur(6px);line-height:1.8}
.legend div{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend i.sq{border-radius:2px}
.status{left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--hud);border:1.5px solid var(--line);border-radius:8px;padding:9px 16px;backdrop-filter:blur(6px);min-width:300px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.status .lamp{width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(34,137,76,.2);flex-shrink:0}
.status b{font-size:14px;letter-spacing:.02em;white-space:nowrap}
.status span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.risk{flex:1;min-width:70px;height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden}
.risk div{height:100%;width:0;background:var(--ok);transition:width .12s linear}
.status.bad{border-color:var(--bad)} .status.bad .lamp{background:var(--bad);box-shadow:0 0 0 4px rgba(207,59,44,.22)} .status.bad b{color:var(--bad)}
.status.warn{border-color:var(--warn)} .status.warn .lamp{background:var(--warn);box-shadow:0 0 0 4px rgba(201,138,16,.22)} .status.warn b{color:var(--warn)}
.hint{right:14px;bottom:14px;font-size:11.5px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal[hidden]{display:none}
.modal-card{background:var(--panel);border-radius:10px;width:min(1100px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-head h3{margin:0;font-size:16px;flex:1;min-width:180px}
.modal-head p{margin:0;width:100%;font-size:12px;color:var(--muted)}
.modal-head .btn{padding:7px 12px}
.bp-wrap{overflow:auto;padding:16px;background:var(--panel-2)}
#bp-canvas{display:block;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.15);margin:0 auto}

@media (max-width:820px){
  html,body{height:auto}
  .app{flex-direction:column;height:auto}
  main{height:62vh;flex:none;order:1}
  aside{width:100%;order:2;border-right:none;border-top:1px solid var(--line);overflow:visible}
  .status{min-width:0;width:calc(100% - 24px);bottom:12px;padding:8px 12px;gap:8px}
  .status span{display:none}
  .legend{font-size:11px;padding:6px 9px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>木工手機座設計模擬</h1>
      <p>十字咬合結構 · 重心、風力與震動測試 · 1:1 劃線圖</p>
    </div>

    <div class="actions">
      <button class="btn primary" id="btn-phone">放上手機</button>
      <button class="btn" id="btn-test">測試穩定度</button>
      <button class="btn" id="btn-bp">導出 2D 圖紙</button>
      <button class="btn" id="btn-reset">扶正重設</button>
      <button class="btn wide" id="btn-push">推倒測試（按所選風向推）</button>
    </div>

    <section class="sec">
      <h2><span class="step">1</span>木板材料</h2>
      <div id="g-wood"></div>
      <div class="derived" id="d-L2"></div>
      <div class="ctl">
        <div class="ctl-row"><label for="sel-wood">木材種類（密度）</label></div>
        <select id="sel-wood">
          <option value="0.45">松木 · 0.45 g/cm³</option>
          <option value="0.55" selected>夾板 · 0.55 g/cm³</option>
          <option value="0.65">樺木 · 0.65 g/cm³</option>
          <option value="0.75">橡木 · 0.75 g/cm³</option>
        </select>
      </div>
    </section>

    <section class="sec">
      <h2><span class="step">2</span>角度與交叉位置</h2>
      <div id="g-struct"></div>
      <div class="derived" id="d-b"></div>
      <button class="btn small" id="btn-auto">自動建議交叉位置</button>
      <p class="hint-line">交叉位置決定兩塊板的槽口在哪裡，系統會自動計算底座槽口位置 b，令兩板同時觸地。</p>
    </section>

    <section class="sec">
      <h2><span class="step">3</span>手機規格</h2>
      <div class="seg" id="seg-orient">
        <button data-v="portrait" class="on">直放</button>
        <button data-v="landscape">橫放</button>
      </div>
      <div id="g-phone"></div>
    </section>

    <section class="sec">
      <h2><span class="step">4</span>環境模擬</h2>
      <div id="g-env"></div>
      <div class="ctl-row"><label>風向</label></div>
      <div class="seg" id="seg-wind">
        <button data-v="front" class="on">前風</button>
        <button data-v="back">後風</button>
        <button data-v="left">左側風</button>
        <button data-v="right">右側風</button>
      </div>
    </section>

    <section class="sec toggles">
      <h2>顯示</h2>
      <label><input type="checkbox" id="t-cog" checked> 複合重心點 (CoG) 與投影</label>
      <label><input type="checkbox" id="t-sup" checked> 地面支撐範圍</label>
      <label><input type="checkbox" id="t-lab" checked> 板材標籤 A / B</label>
      <label><input type="checkbox" id="t-slow"> 慢動作（0.25×）觀察跌倒過程</label>
    </section>

    <section class="sec" id="report-sec">
      <h2>穩定度分析</h2>
      <div id="report"></div>
    </section>
  </aside>

  <main id="stage">
    <div id="stage-canvas"></div>
    <div class="hud legend">
      <div><i style="background:#e0412f"></i>複合重心 (CoG)</div>
      <div><i style="background:#e8a33a"></i>木座重心</div>
      <div><i style="background:#3f7de0"></i>手機重心</div>
      <div><i class="sq" style="background:rgba(47,158,90,.6)"></i>地面支撐範圍</div>
    </div>
    <div class="hud views">
      <button data-view="persp">立體</button>
      <button data-view="side">側視</button>
      <button data-view="front">正視</button>
    </div>
    <div class="hud status" id="status">
      <div class="lamp"></div>
      <b id="st-en">STATUS: STABLE</b>
      <span id="st-zh">穩定</span>
      <div class="risk" title="傾覆風險"><div id="risk-bar"></div></div>
    </div>
    <div class="hud hint">拖曳旋轉 · 滾輪縮放 · 右鍵或 Shift 拖曳平移</div>
  </main>
</div>

<div class="modal" id="bp-modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="bp-title">
    <div class="modal-head">
      <h3 id="bp-title">2D 工程劃線圖紙（1:1）</h3>
      <button class="btn primary" id="bp-svg">導出 SVG</button>
      <button class="btn" id="bp-png">導出 PNG (300 dpi)</button>
      <button class="btn" id="bp-close">關閉</button>
      <p>SVG 以毫米為單位，列印時選「實際大小 / 100%」即為 1:1；請先用圖上 50 mm 比例尺核對。</p>
    </div>
    <div class="bp-wrap" id="bp-wrap"><canvas id="bp-canvas"></canvas></div>
  </div>
</div>

<script>
(function(){
'use strict';
const V3=THREE.Vector3, XAX=new V3(1,0,0), DEG=Math.PI/180, G=9.81, QCOEF=0.5*1.2*1.2, MU=0.35, SHAKE_PER_LEVEL=0.5, GCM=981;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const f1=v=>(Math.round(v*10)/10).toFixed(1);
const f2=v=>(Math.round(v*100)/100).toFixed(2);
const $=s=>document.querySelector(s);

/* ---------------- parameters ---------------- */
const P={Ltotal:20,L1:12,W:8,T:1.5,density:0.55,a:2.5,theta:70,
  pL:15,pW:7.2,pT:0.8,pM:180,orient:'portrait',shake:0,wind:0,windDir:'front',
  showCoG:true,showSupport:true,showLabels:true};

const controls={};
function addSlider(parentId,k,label,min,max,step,unit){
  const wrap=document.createElement('div'); wrap.className='ctl';
  wrap.innerHTML=`<div class="ctl-row"><label for="r-${k}">${label}</label><span class="val"><input type="number" id="n-${k}" min="${min}" max="${max}" step="${step}" aria-label="${label.replace(/<[^>]+>/g,'')}"><em>${unit}</em></span></div><input type="range" id="r-${k}" min="${min}" max="${max}" step="${step}">`;
  document.getElementById(parentId).appendChild(wrap);
  const r=wrap.querySelector('input[type=range]'), n=wrap.querySelector('input[type=number]');
  r.addEventListener('input',()=>setParam(k,+r.value));
  n.addEventListener('change',()=>{const v=parseFloat(n.value); setParam(k,isNaN(v)?P[k]:v);});
  controls[k]={r,n,wrap};
}
addSlider('g-wood','Ltotal','總長度 L<sub>total</sub>',10,60,0.5,'cm');
addSlider('g-wood','L1','背板長度 L<sub>1</sub>',4,56,0.5,'cm');
addSlider('g-wood','W','木板寬度 W',3,20,0.5,'cm');
addSlider('g-wood','T','木板厚度 T',0.5,3,0.1,'cm');
addSlider('g-struct','theta','傾斜角度 θ（背板與地面）',45,85,1,'°');
addSlider('g-struct','a','交叉位置 a（背板槽口中心距底端）',1,20,0.1,'cm');
addSlider('g-phone','pL','手機長度',8,20,0.1,'cm');
addSlider('g-phone','pW','手機寬度',4,12,0.1,'cm');
addSlider('g-phone','pT','手機厚度',0.5,2,0.05,'cm');
addSlider('g-phone','pM','手機重量',80,400,5,'g');
addSlider('g-env','shake','桌面震動強度',0,10,0.5,'級');
addSlider('g-env','wind','風速',0,25,0.5,'m/s');
const shakeNote=document.createElement('p'); shakeNote.className='hint-line'; controls.shake.wrap.appendChild(shakeNote);
const windNote=document.createElement('p'); windNote.className='hint-line'; controls.wind.wrap.appendChild(windNote);

function constrain(){
  P.Ltotal=clamp(P.Ltotal,10,60);
  P.T=clamp(P.T,0.5,3); P.W=clamp(P.W,3,20);
  const L1max=P.Ltotal-4;
  controls.L1.r.max=controls.L1.n.max=L1max;
  P.L1=clamp(P.L1,4,L1max);
  const amin=Math.ceil((P.T/2+0.3)*10)/10, amax=Math.floor((P.L1-P.T/2-1)*10)/10;
  controls.a.r.min=controls.a.n.min=amin; controls.a.r.max=controls.a.n.max=amax;
  P.a=clamp(P.a,amin,amax);
  P.theta=clamp(P.theta,45,85);
  P.pL=clamp(P.pL,8,20); P.pW=clamp(P.pW,4,12); P.pT=clamp(P.pT,0.5,2); P.pM=clamp(P.pM,80,400);
  P.shake=clamp(P.shake,0,10); P.wind=clamp(P.wind,0,25);
}
function syncControls(){
  for(const k in controls){const c=controls[k]; c.r.value=P[k]; c.n.value=+(+P[k]).toFixed(2);}
}
function setParam(k,v){
  P[k]=v; constrain(); syncControls();
  if(k==='shake'||k==='wind'){updateEnvNotes(); return;}
  rebuild();
}
function updateEnvNotes(){
  const s=P.shake, aPk=s*SHAKE_PER_LEVEL;
  const sd= s===0?'無震動': s<=3?'輕微：打字、放下杯子': s<=6?'中等：有人碰撞桌子': '強烈：猛力搖晃 / 地震級';
  shakeNote.textContent=`${sd}（峰值約 ${f2(aPk/G)} g）`;
  const v=P.wind, km=v*3.6;
  const wd= v<0.3?'無風': v<3.4?'輕風':v<5.5?'微風（風扇）':v<8?'和風':v<10.8?'清勁風':v<13.9?'強風':v<17.2?'疾風':'烈風（颱風級）';
  windNote.textContent=`${wd} · 約 ${Math.round(km)} km/h`;
}

/* ---------------- geometry & physics model ---------------- */
let MD=null;
function computeModel(p){
  const th=p.theta*DEG, s=Math.sin(th), c=Math.cos(th);
  const T=p.T, W=p.W, L1=p.L1, L2=+(p.Ltotal-p.L1).toFixed(4), a=p.a;
  const dA=new V3(0,s,-c);           // along backrest A (up & back)
  const nA=new V3(0,c,s);            // A front face normal (= B length direction)
  const dB=nA.clone();               // along base B (forward & slightly up)
  const uB=dA.clone();               // B upper face normal
  // B notch position so both boards touch the ground
  const bIdeal=(a*s+T/2*(c-s))/c;
  const bMin=T/2+0.3, bMax=L2-T/2-0.3;
  let b=bIdeal, bOk=true;
  if(b>bMax){b=bMax;bOk=false;}
  if(b<bMin){b=bMin;bOk=false;}
  const oA=dA.clone().multiplyScalar(-a), oB=dB.clone().multiplyScalar(-b), Pc=new V3();
  const side=(o,d,n,L)=>{const r=[];for(const u of [0,L])for(const t of [-T/2,T/2])r.push(o.clone().addScaledVector(d,u).addScaledVector(n,t));return r;};
  const cA=side(oA,dA,nA,L1), cB=side(oB,dB,uB,L2);
  const all=[...cA,...cB];
  const minY=Math.min(...all.map(v=>v.y));
  const cont0=all.filter(v=>v.y-minY<0.03);
  const zb0=Math.min(...cont0.map(v=>v.z)), zf0=Math.max(...cont0.map(v=>v.z));
  const shift=new V3(0,-minY,-(zb0+zf0)/2);
  [oA,oB,Pc,...all].forEach(v=>v.add(shift));
  const zb=zb0+shift.z, zf=zf0+shift.z;

  // masses & CoGs (g, cm)
  const notchArea=T*W/2;
  const boardInfo=(o,d,L,np,vs)=>{const area=L*W-notchArea; const u=(L*W*L/2-notchArea*np)/area; const v=-(notchArea*vs*W/4)/area;
    return {area,cog:o.clone().addScaledVector(d,u).addScaledVector(XAX,v),mid:o.clone().addScaledVector(d,L/2)};};
  const iA=boardInfo(oA,dA,L1,a,+1), iB=boardInfo(oB,dB,L2,b,-1);
  const mA=iA.area*T*p.density, mB=iB.area*T*p.density, mStand=mA+mB;
  const cogStand=iA.cog.clone().multiplyScalar(mA).addScaledVector(iB.cog,mB).divideScalar(mStand);

  // phone
  const ph=p.orient==='portrait'?p.pL:p.pW, pw=p.orient==='portrait'?p.pW:p.pL, pt=p.pT;
  const crotch=Pc.clone().addScaledVector(nA,T/2).addScaledVector(uB,T/2);
  const phoneCenter=crotch.clone().addScaledVector(dA,ph/2).addScaledVector(nA,pt/2);
  const lip=L2-b-T/2;
  const held=lip>=pt*0.7;
  // backrest length above the crotch; phone pivots over A's top edge if its CoG lies behind that edge
  const Lu=L1-a-T/2;
  const LuNeed=ph/2-(pt/2)*s/c;
  const phoneBal=Lu>LuNeed;
  const flipEdge=crotch.clone().addScaledVector(dA,Lu);
  const mTot=mStand+p.pM;
  const cogAll=cogStand.clone().multiplyScalar(mStand).addScaledVector(phoneCenter,p.pM).divideScalar(mTot);

  const md={s,c,T,W,L1,L2,a,b,bIdeal,bOk,dA,nA,dB,uB,oA,oB,Pc,cA,cB,zb,zf,mA,mB,mStand,mTot,
    cogStand,cogAll,iA,iB,ph,pw,pt,crotch,phoneCenter,lip,held,Lu,LuNeed,phoneBal,flipEdge,pM:p.pM};

  // wind exposure (cm², cm)
  const exposure=(withPhone)=>{
    const items=[];
    const coverA=withPhone?Math.min(ph,Math.max(0,L1-a-T/2))*Math.min(W,pw):0;
    items.push({af:Math.max(0,L1*W-coverA)*s, as:L1*T, y:iA.mid.y});
    items.push({af:L2*W*c, as:Math.max(0,L2*T-T*T), y:iB.mid.y});
    if(withPhone) items.push({af:pw*ph*s, as:ph*pt, y:phoneCenter.y});
    let Af=0,As=0,mf=0,ms=0;
    for(const it of items){Af+=it.af;As+=it.as;mf+=it.af*it.y;ms+=it.as*it.y;}
    return {Af:Af/1e4,As:As/1e4,hf:(Af?mf/Af:0)/100,hs:(As?ms/As:0)/100};
  };
  const stab=(cog,mass_g,withPhone)=>{
    const M=mass_g/1000, ex=exposure(withPhone);
    const db=(cog.z-zb)/100, df=(zf-cog.z)/100, dsR=(W/2-cog.x)/100, dsL=(W/2+cog.x)/100, h=Math.max(cog.y,0.01)/100;
    const crit=(d,A,hh)=>d<=0?0:Math.sqrt(M*G*d/(QCOEF*A*hh));
    return {M,db,df,dsR,dsL,h,...ex,
      vFront:crit(db,ex.Af,ex.hf), vBack:crit(df,ex.Af,ex.hf), vSide:crit(Math.min(dsR,dsL),ex.As,ex.hs),
      vSlideZ:Math.sqrt(MU*M*G/(QCOEF*ex.Af)), vSlideX:Math.sqrt(MU*M*G/(QCOEF*ex.As)),
      aZ:Math.max(0,Math.min(db,df))/h, aX:Math.max(0,Math.min(dsR,dsL))/h};
  };
  md.alone=stab(cogStand,mStand,false);
  md.withPhone=stab(cogAll,mTot,true);

  // collision check points (3D)
  md.standPts=[];
  for(const v of [...cA,...cB]) for(const x of [-W/2,W/2]) md.standPts.push(new V3(x,v.y,v.z));
  md.phonePts=[];
  for(const u of [0,ph]) for(const t of [0,pt]) for(const x of [-pw/2,pw/2])
    md.phonePts.push(crotch.clone().addScaledVector(dA,u).addScaledVector(nA,t).add(new V3(x,0,0)));
  return md;
}

function woodTexture(base,dark,seed){
  const cv=document.createElement('canvas'); cv.width=cv.height=512;
  const g=cv.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,512,512);
  let r=seed; const rnd=()=>{r=(r*9301+49297)%233280; return r/233280;};
  for(let i=0;i<70;i++){
    const y0=rnd()*512, amp=2+rnd()*7, fq=0.004+rnd()*0.01, ph=rnd()*6.28;
    g.strokeStyle=dark; g.globalAlpha=0.08+rnd()*0.22; g.lineWidth=0.6+rnd()*2.2;
    g.beginPath();
    for(let x=0;x<=512;x+=8){const y=y0+Math.sin(x*fq+ph)*amp+Math.sin(x*fq*3.1)*amp*0.3; x?g.lineTo(x,y):g.moveTo(x,y);}
    g.stroke();
  }
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(cv); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(0.07,0.09); t.encoding=THREE.sRGBEncoding; t.anisotropy=4;
  return t;
}

function disposeGroup(gr){

}

function boardGeometry(L,np,notchPlusX,d,origin,T,W){
  const s=new THREE.Shape(), h=W/2, l=np-T/2, r=np+T/2;
  if(notchPlusX){s.moveTo(0,-h);s.lineTo(L,-h);s.lineTo(L,h);s.lineTo(r,h);s.lineTo(r,0);s.lineTo(l,0);s.lineTo(l,h);s.lineTo(0,h);s.lineTo(0,-h);}
  else{s.moveTo(0,h);s.lineTo(0,-h);s.lineTo(l,-h);s.lineTo(l,0);s.lineTo(r,0);s.lineTo(r,-h);s.lineTo(L,-h);s.lineTo(L,h);s.lineTo(0,h);}
  const g=new THREE.ExtrudeGeometry(s,{depth:T,bevelEnabled:false});
  g.translate(0,0,-T/2);
  const third=new V3().crossVectors(d,XAX);
  const M=new THREE.Matrix4().makeBasis(d,XAX,third); M.setPosition(origin);
  g.applyMatrix4(M);
  return g;
}

  g.fillStyle='#f2c230'; g.font='bold 46px "Noto Sans TC",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,128,51);

function rebuild(){
  MD=computeModel(P);

  const pts=[new V3(-W/2,0.04,MD.zb),new V3(W/2,0.04,MD.zb),new V3(W/2,0.04,MD.zf),new V3(-W/2,0.04,MD.zf),new V3(-W/2,0.04,MD.zb)];
  supportGroup.add(sp,new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),supEdgeMat));

  buildPhoneMesh();

  if(S.phone==='on'||S.phone==='placing'){

    afterPlaced();
  } else { phone.visible=false; S.phone='off'; checkStatic(); }
  updateMarkers(); renderDerived(); renderReport(); updateStatusNow();
}

function updateMarkers(){
  const withP=S.phone==='on'&&phone.parent===rig;
  const cog=withP?MD.cogAll:MD.cogStand;
  cogSphere.position.copy(cog);
  cogStandSphere.position.copy(MD.cogStand);
  cogPhoneSphere.position.copy(MD.phoneCenter);
  cogLine.geometry.setFromPoints([cog.clone(),new V3(cog.x,0.05,cog.z)]); cogLine.computeLineDistances();
  cogRing.position.set(cog.x,0.06,cog.z);
  const vis=P.showCoG;
  cogSphere.visible=cogLine.visible=cogRing.visible=vis;
  cogStandSphere.visible=vis&&withP;
  cogPhoneSphere.visible=vis&&withP;
  supportGroup.visible=P.showSupport;
  const ok=!S.tip&&currentStab().db>0&&currentStab().df>0;
  supMat.color.set(ok?0x2f9e5a:0xd8453a); supEdgeMat.color.set(ok?0x2f9e5a:0xd8453a);
}

function resetDynamic(clearPhoneSlip=true){
  S.tip=null; S.acc=0; S.slide.set(0,0,0); S.sliding=false; S.risk=0;
  pivot.position.set(0,0,0); pivot.rotation.set(0,0,0); rig.position.set(0,0,0); world.position.set(0,0,0);
  if(phone.parent!==rig){ rig.add(phone); }
  if(clearPhoneSlip&&(S.phone==='slipped'||S.phone==='slipping')){S.phone='off'; phone.visible=false; S.anim=null;}
  if(S.phone==='slipped'||S.phone==='slipping'||S.phone==='flipping'){S.phone='off'; phone.visible=false; S.anim=null;}
  S.slipped=false; S.pb=null; S.impact=null; S.flip=null;
}

/* ---------- phone actions ---------- */
const btnPhone=$('#btn-phone');
function setPhoneBtn(){btnPhone.textContent=(S.phone==='on'||S.phone==='placing')?'拿走手機':'放上手機';}
function tween(dur,fromPos,toPos,fromQ,toQ,done,arc=0){
  S.anim={t:0,dur,fromPos,toPos,fromQ,toQ,done,arc};
}
function placePhone(){
  if(S.anim) return;
  if(S.tip||S.phone==='slipped') { resetDynamic(true); }
  const p=phonePose();
  phone.visible=true; S.phone='placing';
  tween(0.65,p.pos.clone().addScaledVector(MD.dA,14).add(new V3(0,4,0)),p.pos,p.q,p.q,()=>{S.phone='on'; afterPlaced();});
  setPhoneBtn(); updateMarkers();
}
function removePhone(){
  if(S.anim) return;
  if(S.tip){resetDynamic(true);}
  const p=phonePose();
  S.phone='removing';
  tween(0.5,phone.position.clone(),p.pos.clone().addScaledVector(MD.dA,14).add(new V3(0,4,0)),phone.quaternion.clone(),p.q,()=>{S.phone='off'; phone.visible=false; updateMarkers(); renderReport(); checkStatic();});
  setPhoneBtn(); updateMarkers();
}
function afterPlaced(){
  updateMarkers(); setPhoneBtn(); renderReport();
  if(!MD.held){ startSlip(); return; }
  if(!MD.phoneBal){ startFlip(); return; }
  checkStatic();
}
function startSlip(){
  S.phone='slipping'; S.phoneFall='lip';
  const g=phoneGroundPose();
  tween(0.9,phone.position.clone(),g.pos,phone.quaternion.clone(),g.q,()=>{
    S.phone='slipped'; world.attach(phone); updateMarkers(); setPhoneBtn(); updateStatusNow();
  },3);
  updateMarkers(); setPhoneBtn();
}
function startFlip(){
  S.phone='flipping'; S.phoneFall='flip';
  const r0=MD.phoneCenter.clone().sub(MD.flipEdge);
  S.flip={ang:0,w:0.2,r0,q0:phone.quaternion.clone(),I:r0.lengthSq()+(MD.ph*MD.ph+MD.pt*MD.pt)/12};
  updateMarkers(); setPhoneBtn(); updateStatusNow();
}
function stepFlip(dt){
  const f=S.flip; if(!f) return;
  const axis=new V3(-1,0,0), n=3, h=dt/n;
  for(let i=0;i<n;i++){
    const c=Math.cos(f.ang), s=Math.sin(f.ang);
    const z=-f.r0.y*s+f.r0.z*c;                   // CoG z relative to A's top edge after rotating backward
    f.w+=GCM*(-z)/f.I*h; f.ang+=f.w*h;
  }
  const R=new THREE.Quaternion().setFromAxisAngle(axis,f.ang);
  const r=f.r0.clone().applyQuaternion(R);
  phone.position.copy(MD.flipEdge).add(r);
  phone.quaternion.copy(R).multiply(f.q0);
  if(f.ang>0.6){                                  // phone has rolled over the top edge: let it fall freely
    const wv=axis.clone().multiplyScalar(f.w);
    const v=new V3().crossVectors(wv,r);
    world.attach(phone);
    S.pb={v,w:wv,hits:0,settling:false};
    S.flip=null; S.phone='slipped';
    updateMarkers(); setPhoneBtn(); updateStatusNow();
  }
}
function checkStatic(){
  const st=currentStab();
  if(st.db<=0) startTip('B'); else if(st.df<=0) startTip('F');
  else if(st.dsR<=0) startTip('R'); else if(st.dsL<=0) startTip('L');
}

/* ---------- tipping ---------- */
function pivotPoint(dir){
  if(dir==='F') return new V3(0,0,MD.zf);
  if(dir==='B') return new V3(0,0,MD.zb);
  if(dir==='R') return new V3(MD.W/2,0,0);
  return new V3(-MD.W/2,0,0);
}
function applyPivot(dir,ang){
  const pv=dir?pivotPoint(dir):new V3();
  pivot.position.copy(pv); rig.position.copy(pv).negate(); pivot.rotation.set(0,0,0);
  if(!dir) return;
  if(dir==='F') pivot.rotation.x=ang; else if(dir==='B') pivot.rotation.x=-ang;
  else if(dir==='R') pivot.rotation.z=-ang; else pivot.rotation.z=ang;
}
function tipGeom(dir){
  const on=S.phone==='on'&&phone.parent===rig;
  const cog=on?MD.cogAll:MD.cogStand;
  let e; const h=cog.y;
  if(dir==='F') e=cog.z-MD.zf; else if(dir==='B') e=MD.zb-cog.z; else if(dir==='R') e=cog.x-MD.W/2; else e=-MD.W/2-cog.x;
  const pts=on?MD.standPts.concat(MD.phonePts):MD.standPts;
  const H=Math.max(...pts.map(p=>p.y)), D=Math.max(MD.zf-MD.zb,MD.W);
  return {e,h,I:e*e+h*h+(H*H+D*D)/12};   // I/M about pivot edge (cm²)
}
function startTip(dir){
  if(S.tip) return;
  const tg=tipGeom(dir);
  // initial spin just enough to lift the CoG over the pivot edge (the push / gust that started it)
  const hump=Math.max(0,Math.hypot(tg.e,tg.h)-tg.h);
  const w0=Math.sqrt(2*GCM*hump/tg.I)*1.06+0.25;
  S.tip={dir,ang:0,w:w0,done:false,bounces:0,released:false,...tg};
  S.impact=null;
  updateMarkers(); updateStatusNow();
}
function minYAt(dir,ang){
  applyPivot(dir,ang); world.updateMatrixWorld(true);
  const pv=pivotPoint(dir);
  const pts=(S.phone==='on'&&phone.parent===rig)?MD.standPts.concat(MD.phonePts):MD.standPts;
  let mn=Infinity;
  for(const p of pts){
    const dist=(dir==='F'||dir==='B')?Math.hypot(p.y,p.z-pv.z):Math.hypot(p.y,p.x-pv.x);
    if(dist<0.4) continue;
    const w=p.clone().applyMatrix4(rig.matrixWorld);
    if(w.y<mn) mn=w.y;
  }
  return mn;
}
function phoneOnStand(){return S.phone==='on'&&phone.parent===rig;}
function releasePhone(){
  const t=S.tip; t.released=true;
  applyPivot(t.dir,t.ang); world.updateMatrixWorld(true);
  const pv=pivotPoint(t.dir);
  const axis=t.dir==='F'?new V3(1,0,0):t.dir==='B'?new V3(-1,0,0):t.dir==='R'?new V3(0,0,-1):new V3(0,0,1);
  world.attach(phone);
  const wv=axis.multiplyScalar(t.w);
  S.pb={v:new V3().crossVectors(wv,phone.position.clone().sub(pv)),w:wv.clone(),hits:0,settling:false};
  updateMarkers();
}
function advanceTip(dt){
  const t=S.tip; if(t.done) return;
  const n=4, h=dt/n;
  for(let i=0;i<n;i++){
    const c=Math.cos(t.ang), s=Math.sin(t.ang);
    t.w+=GCM*(t.e*c+t.h*s)/t.I*h;          // gravity torque about the edge
    const prev=t.ang; t.ang+=t.w*h;
    if(t.ang<0){t.ang=0; t.w=Math.abs(t.w)*0.3;}
    // phone slides / flies off when falling forward or sideways; stays on the backrest when falling backward
    if(!t.released&&phoneOnStand()&&t.dir!=='B'&&t.ang>(t.dir==='F'?12:28)*DEG) releasePhone();
    if(t.w>0&&(minYAt(t.dir,t.ang)<0||t.ang>Math.PI/2+0.4)){
      let lo=prev,hi=t.ang;
      for(let j=0;j<9;j++){const mid=(lo+hi)/2; if(minYAt(t.dir,mid)<0) hi=mid; else lo=mid;}
      t.ang=lo;
      if(t.bounces===0&&phoneOnStand()){            // backward fall: phone hits the table together with the stand
        applyPivot(t.dir,t.ang); world.updateMatrixWorld(true);
        const pc=MD.phoneCenter.clone().applyMatrix4(rig.matrixWorld), pv=pivotPoint(t.dir);
        S.impact=Math.abs(t.w)*Math.hypot(pc.y-pv.y,(t.dir==='F'||t.dir==='B')?pc.z-pv.z:pc.x-pv.x);
      }
      if(t.w>0.9&&t.bounces<3){t.w=-t.w*0.28; t.bounces++;}
      else {t.w=0; t.done=true; break;}
    }
  }
  applyPivot(t.dir,t.ang);
}
function settlePhone(){
  const b=S.pb; b.settling=true;
  const zAx=new V3(0,0,1).applyQuaternion(phone.quaternion), yAx=new V3(0,1,0).applyQuaternion(phone.quaternion);
  const up=zAx.y>=0?new V3(0,1,0):new V3(0,-1,0);
  let fwd=yAx.clone(); fwd.y=0; if(fwd.lengthSq()<1e-4) fwd.set(0,0,-1); fwd.normalize();
  const xAx=new V3().crossVectors(fwd,up);
  const q=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAx,fwd,up));
  const to=phone.position.clone().addScaledVector(new V3(b.v.x,0,b.v.z),0.1); to.y=MD.pt/2+0.01;
  tween(0.3,phone.position.clone(),to,phone.quaternion.clone(),q,()=>{S.pb=null; updateStatusNow();});
}
function stepPhoneBody(dt){
  const b=S.pb; if(!b||b.settling) return;
  const n=3, h=dt/n, dq=new THREE.Quaternion(), tmp=new V3();
  for(let i=0;i<n;i++){
    b.v.y-=GCM*h;
    phone.position.addScaledVector(b.v,h);
    const wl=b.w.length();
    if(wl>1e-4){dq.setFromAxisAngle(tmp.copy(b.w).divideScalar(wl),wl*h); phone.quaternion.premultiply(dq);}
    let mn=Infinity;
    for(const c of phoneCorners){const y=c.clone().applyQuaternion(phone.quaternion).y+phone.position.y; if(y<mn) mn=y;}
    if(mn<0){
      phone.position.y-=mn;
      if(b.v.y<0){
        if(S.impact==null) S.impact=-b.v.y;
        b.v.y=-b.v.y*0.3; b.v.x*=0.55; b.v.z*=0.55; b.w.multiplyScalar(0.45); b.hits++;
        if(Math.abs(b.v.y)<35||b.hits>4){settlePhone(); return;}
      }
    }
  }
}

/* ---------- main loop ---------- */
let lastT=performance.now(), statusClock=0;
function easeInOut(k){return k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;}
function stepAnim(dt){
  const A=S.anim; if(!A) return;
  A.t+=dt; const k=Math.min(1,A.t/A.dur), e=easeInOut(k);
  phone.position.lerpVectors(A.fromPos,A.toPos,e);
  if(A.arc) phone.position.y+=Math.sin(Math.PI*k)*A.arc;
  phone.quaternion.copy(A.fromQ).slerp(A.toQ,e);
  if(k>=1){S.anim=null; A.done&&A.done();}
}
function stepPhysics(dt){
  S.t+=dt;
  if(S.tip){advanceTip(dt); world.position.copy(S.slide); S.risk=1; return;}
  if(S.phone==='placing'||S.phone==='removing'||S.phone==='slipping'||S.phone==='flipping'){applyPivot(null,0); S.risk=0; return;}
  const st=currentStab();
  const aPk=P.shake*SHAKE_PER_LEVEL, t=S.t;
  let az=0,ax=0;
  if(aPk>0){
    az=aPk*(0.62*Math.sin(2*Math.PI*7.3*t)+0.38*Math.sin(2*Math.PI*11.7*t+1.3));
    ax=aPk*0.6*(0.6*Math.sin(2*Math.PI*5.9*t+0.4)+0.4*Math.sin(2*Math.PI*9.1*t+2.1));
  }
  const v=P.wind; let Fz=0,Fx=0;
  if(v>0){
    if(P.windDir==='front') Fz=-QCOEF*st.Af*v*v;
    else if(P.windDir==='back') Fz=QCOEF*st.Af*v*v;
    else {const F=QCOEF*st.As*v*v; Fx=P.windDir==='left'?F:-F;}
  }
  const Mg=st.M*G;
  const mZ=Fz*st.hf+st.M*az*st.h, mX=Fx*st.hs+st.M*ax*st.h;
  const ratios={F:st.df>0?mZ/(Mg*st.df):9,B:st.db>0?-mZ/(Mg*st.db):9,R:st.dsR>0?mX/(Mg*st.dsR):9,L:st.dsL>0?-mX/(Mg*st.dsL):9};
  let dir='F',r=-Infinity; for(const k in ratios) if(ratios[k]>r){r=ratios[k];dir=k;}
  S.risk=Math.max(0,r); S.riskDir=dir;
  if(r>1){ S.acc+=dt*(1+(r-1)*5); if(S.acc>0.07){startTip(dir); return;} }
  else S.acc=Math.max(0,S.acc-dt*0.6);
  // rocking (visual lean when close to limit)
  const lean=r>0.35?Math.pow(Math.min(r,1),3)*3*DEG:0;
  applyPivot(lean>0?dir:null,lean);
  // sliding under wind
  const Fh=Math.abs(Fz)+Math.abs(Fx);
  S.sliding=Fh>MU*Mg;
  if(S.sliding&&S.slide.length()<18){
    const sp=3*(Fh/(MU*Mg)-1+0.3)*dt;
    if(Fz) S.slide.z+=Math.sign(Fz)*sp; if(Fx) S.slide.x+=Math.sign(Fx)*sp;
  }
  world.position.set(S.slide.x+ax*0.05,0,S.slide.z+az*0.05);
}
function stepWind(dt){
  const v=P.wind;
  windLines.material.opacity=v>0?Math.min(0.75,0.18+v/25):0;
  if(v<=0) return;
  const d=P.windDir==='front'?new V3(0,0,-1):P.windDir==='back'?new V3(0,0,1):P.windDir==='left'?new V3(1,0,0):new V3(-1,0,0);
  const sp=v*3;
  for(let i=0;i<NW;i++){
    const s=wSeed[i];
    s.x+=d.x*sp*s.sp*dt; s.z+=d.z*sp*s.sp*dt;
    if(s.x>24)s.x-=48; if(s.x<-24)s.x+=48; if(s.z>24)s.z-=48; if(s.z<-24)s.z+=48;
    const j=i*6;
    wPos[j]=s.x; wPos[j+1]=s.y; wPos[j+2]=s.z;
    wPos[j+3]=s.x-d.x*s.len; wPos[j+4]=s.y; wPos[j+5]=s.z-d.z*s.len;
  }
  wGeo.attributes.position.needsUpdate=true;
}

/* ---------- status ---------- */
const stEl=$('#status'), stEn=$('#st-en'), stZh=$('#st-zh'), riskBar=$('#risk-bar');
const dirName={F:'向前',B:'向後',L:'向左',R:'向右'};
function updateStatusNow(){
  let cls='', en='STATUS: STABLE', zh='穩定';
  if(S.tip){cls='bad'; en='STATUS: UNSTABLE (TIPPED)'; zh=`已${dirName[S.tip.dir]}傾倒`;
    if(S.impact!=null&&S.phone==='on'){const v=S.impact/100; zh+=`，手機落地速度 ${f1(v)} m/s（≈ 從 ${f1(S.impact*S.impact/(2*GCM))} cm 高跌下）`;}}
  else if(S.phone==='slipping'||S.phone==='slipped'||S.phone==='flipping'){cls='bad';
    if(S.phoneFall==='flip'){en='STATUS: UNSTABLE (PHONE FELL OFF)'; zh='背板太矮，手機重心越過背板頂部，向後翻落';}
    else {en='STATUS: UNSTABLE (PHONE SLIPPED)'; zh='托板唇口太短，手機滑落';}}
  else if(S.sliding){cls='warn'; en='STATUS: SLIDING'; zh='風力大於摩擦力，整體在桌面滑動';}
  else if(S.risk>0.75){cls='warn'; en='STATUS: NEAR LIMIT'; zh=`接近${dirName[S.riskDir]}傾覆臨界`;}
  else if(S.phone==='off'){zh='穩定（未放手機）';}
  stEl.className='hud status '+cls; stEn.textContent=en; stZh.textContent=zh;
  const pct=Math.min(1,S.risk)*100;
  riskBar.style.width=pct+'%';
  riskBar.style.background=pct>99?'var(--bad)':pct>75?'var(--warn)':'var(--ok)';
}

function loop(now){
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  const sdt=S.slow?dt*0.25:dt;
  stepAnim(sdt); stepFlip(sdt); stepPhysics(sdt); stepPhoneBody(sdt); stepWind(sdt);
  statusClock+=dt; if(statusClock>0.1){statusClock=0; updateStatusNow(); if(S.tip) updateMarkers();}
  orbit.update(); renderer.render(scene,camera);
  requestAnimationFrame(loop);
}

/* ---------- orbit controls ---------- */
class Orbit{
  constructor(cam,el){
    this.cam=cam; this.el=el; this.target=new V3(0,7,0); this.sph=new THREE.Spherical(52,1.08,0.8);
    this.goal=null; this.ptrs=new Map(); this.mode=null;
    el.addEventListener('pointerdown',e=>this.down(e));
    window.addEventListener('pointermove',e=>this.move(e));
    window.addEventListener('pointerup',e=>this.up(e));
    window.addEventListener('pointercancel',e=>this.up(e));
    el.addEventListener('wheel',e=>{e.preventDefault(); this.goal=null; this.sph.radius*=Math.exp(e.deltaY*0.0012);},{passive:false});
    el.addEventListener('contextmenu',e=>e.preventDefault());
  }
  down(e){
    this.ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); this.goal=null;
    if(this.ptrs.size===2){this.mode='pinch'; this.pd=this.pdist(); this.pm=this.pmid();}
    else this.mode=(e.button===2||e.shiftKey)?'pan':'rot';
  }
  move(e){
    const p=this.ptrs.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(this.mode==='pinch'&&this.ptrs.size===2){const d=this.pdist(); this.sph.radius*=this.pd/d; this.pd=d; const m=this.pmid(); this.pan(m.x-this.pm.x,m.y-this.pm.y); this.pm=m; return;}
    if(this.mode==='rot'){this.sph.theta-=dx*0.008; this.sph.phi-=dy*0.008;}
    else if(this.mode==='pan') this.pan(dx,dy);
  }
  up(e){ this.ptrs.delete(e.pointerId); this.mode=this.ptrs.size===1?'rot':this.ptrs.size===0?null:this.mode; }
  pdist(){const a=[...this.ptrs.values()]; return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;}
  pmid(){const a=[...this.ptrs.values()]; return {x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}
  pan(dx,dy){
    const s=this.sph.radius*0.0016;
    const right=new V3().setFromMatrixColumn(this.cam.matrix,0), up=new V3().setFromMatrixColumn(this.cam.matrix,1);
    this.target.addScaledVector(right,-dx*s).addScaledVector(up,dy*s); this.target.y=Math.max(0,this.target.y);
  }
  setView(theta,phi,r){
    let d=theta-this.sph.theta; d=Math.atan2(Math.sin(d),Math.cos(d));
    this.goal={theta:this.sph.theta+d,phi,r,target:new V3(0,7,0)};
  }
  update(){
    if(this.goal){
      const g=this.goal, k=0.14;
      this.sph.theta+=(g.theta-this.sph.theta)*k; this.sph.phi+=(g.phi-this.sph.phi)*k; this.sph.radius+=(g.r-this.sph.radius)*k;
      this.target.lerp(g.target,k);
      if(Math.abs(g.theta-this.sph.theta)<0.002&&Math.abs(g.phi-this.sph.phi)<0.002) this.goal=null;
    }
    this.sph.phi=clamp(this.sph.phi,0.08,Math.PI/2-0.01); this.sph.radius=clamp(this.sph.radius,10,170);
    this.cam.position.setFromSpherical(this.sph).add(this.target); this.cam.lookAt(this.target);
  }
}
const orbit=new Orbit(camera,renderer.domElement);
document.querySelectorAll('.views button').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.view;
  if(v==='persp') orbit.setView(0.8,1.08,52);
  else if(v==='side') orbit.setView(Math.PI/2,Math.PI/2-0.02,44);
  else orbit.setView(0,1.35,46);
}));
function resize(){const r=host.getBoundingClientRect(); renderer.setSize(r.width,r.height,false); camera.aspect=r.width/Math.max(1,r.height); camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(host);

  const el=$('#d-b');
  if(MD.bOk){el.className='derived'; el.innerHTML=`<span>底座槽口位置 b（自動）</span><b>${f2(MD.b)} cm</b>`;}

}
function renderReport(){
  const w=MD.withPhone, pass=(ok,txt,sub)=>`<li class="${ok?'pass':'fail'}"><i>${ok?'✓':'✗'}</i><div>${txt}${sub?`<small>${sub}</small>`:''}</div></li>`;
  const vmin=Math.min(w.vFront,w.vBack,w.vSide);
  const aMin=Math.min(w.aZ,w.aX);
  const staticOk=w.db>0&&w.df>0;
  const checks=[
    [MD.bOk,'兩板可同時觸地',MD.bOk?`底座槽口 b = ${f2(MD.b)} cm`:'把交叉位置 a 調小、或加長底座 L₂、或減少傾斜角'],
    [MD.held,'托板唇口托得住手機',`唇口 ${f1(MD.lip)} cm，需要 ≥ ${f1(MD.pt*0.7)} cm（手機厚度 × 0.7）`],
    [MD.phoneBal,'背板夠高，手機不會向後翻落',`托板以上的背板長 ${f1(MD.Lu)} cm，最少需要 ${f1(Math.max(0,MD.LuNeed))} cm（約手機長度一半）`],
    [staticOk,'放上手機後重心在支撐範圍內',staticOk?`前方餘量 ${f1(w.df*100)} cm，後方餘量 ${f1(w.db*100)} cm`:'重心投影落在支撐範圍外，放上手機會翻倒'],
    [vmin>=5,'抗風 ≥ 5 m/s（風扇近距離吹）',`最弱方向臨界風速 ${f1(vmin)} m/s`],
    [aMin>=0.15,'抗震 ≥ 0.15 g（打字、輕碰桌面）',`臨界水平加速度 ${f2(aMin)} g ≈ 震動第 ${f1(aMin*G/SHAKE_PER_LEVEL)} 級`]
  ];
  const allOk=checks.every(c=>c[0]);
  $('#report').innerHTML=`
    <div class="kv">
      <span>木座質量</span><span>${f1(MD.mStand)} g</span>
      <span>總質量（含手機）</span><span>${f1(MD.mTot)} g</span>
      <span>複合重心高度</span><span>${f1(MD.cogAll.y)} cm</span>
      <span>地面支撐深度</span><span>${f1(MD.zf-MD.zb)} cm</span>
      <span>臨界風速：前風 / 後風</span><span>${f1(w.vFront)} / ${f1(w.vBack)} m/s</span>
      <span>臨界風速：側風</span><span>${f1(w.vSide)} m/s</span>
      <span>開始滑動風速（前後）</span><span>${f1(w.vSlideZ)} m/s</span>
      <span>臨界震動加速度</span><span>${f2(aMin)} g</span>
    </div>
    <ul>${checks.map(c=>pass(...c)).join('')}</ul>
    <div class="verdict ${allOk?'':'fail'}">${allOk?'設計合格：可以進入劃線及加工。':'設計需要修改：請按上面 ✗ 項目調整參數。'}</div>
    <p class="hint-line">以上為含手機的估算（剛體、平均風壓 C<sub>d</sub>=1.2、桌面摩擦 μ=0.35），用來比較不同設計，不代表精確數值。</p>`;
}

/* ---------- blueprint ---------- */
function buildBlueprintSVG(){
  const m=MD, k=10;
  const L1=m.L1*k, L2=m.L2*k, Lt=L1+L2, W=m.W*k, T=m.T*k, a=m.a*k, b=m.b*k;
  const x0=24, parts=[];
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const fm=v=>{const r=Math.round(v*10)/10; return (r%1===0?r.toFixed(0):r.toFixed(1));};
  const tw=(t,s)=>{let w=0; for(const ch of String(t)) w+=ch.charCodeAt(0)>255?s:s*0.58; return w;};
  const INK='#1d2824', CUT='#cf3b2c', CL='#2d5bd7';
  const text=(x,y,t,o={})=>{
    const s=o.size||3, anc=o.anchor||'middle', col=o.color||INK, wt=o.weight||400;
    let bg='';
    if(o.bg){const ww=tw(t,s)+1.6, bx=anc==='middle'?-ww/2:anc==='end'?-ww:-0.8; bg=`<rect x="${bx}" y="${-s*0.88}" width="${ww}" height="${s*1.18}" fill="#fff"/>`;}
    return `<g transform="translate(${x},${y})${o.rot?` rotate(${o.rot})`:''}">${bg}<text x="0" y="0" font-size="${s}" text-anchor="${anc}" fill="${col}" font-weight="${wt}">${esc(t)}</text></g>`;
  };
  const line=(x1,y1,x2,y2,col=INK,w=0.25,dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''}/>`;
  const arrow=(x,y,d,col)=>{const s=2,h=0.65; const p=d==='l'?[[x,y],[x+s,y-h],[x+s,y+h]]:d==='r'?[[x,y],[x-s,y-h],[x-s,y+h]]:d==='u'?[[x,y],[x-h,y+s],[x+h,y+s]]:[[x,y],[x-h,y-s],[x+h,y-s]]; return `<polygon points="${p.map(q=>q.join(',')).join(' ')}" fill="${col}"/>`;};
  const hdim=(x1,x2,yl,yr,lab,col=INK)=>{const sg=yl<yr?-1:1;
    return line(x1,yr+sg*1,x1,yl+sg*1.5,col,0.18)+line(x2,yr+sg*1,x2,yl+sg*1.5,col,0.18)+line(x1,yl,x2,yl,col,0.2)+arrow(x1,yl,'l',col)+arrow(x2,yl,'r',col)+text((x1+x2)/2,yl-1,lab,{size:2.7,color:col,bg:true});};
  const vdim=(y1,y2,xl,xr,lab,col=INK)=>{const sg=xl<xr?-1:1;
    return line(xr+sg*1,y1,xl+sg*1.5,y1,col,0.18)+line(xr+sg*1,y2,xl+sg*1.5,y2,col,0.18)+line(xl,y1,xl,y2,col,0.2)+arrow(xl,y1,'u',col)+arrow(xl,y2,'d',col)+text(xl-1,(y1+y2)/2,lab,{size:2.7,color:col,bg:true,rot:-90});};

  let y=0;
  parts.push(text(x0,13,'木工手機座 1:1 劃線圖紙',{size:6.2,anchor:'start',weight:700}));
  parts.push(text(x0,20,`材料 ${fm(Lt)} × ${fm(W)} × ${fm(T)} mm　背板 A ${fm(L1)} mm　底座 B ${fm(L2)} mm　傾斜角 θ = ${P.theta}°　單位：mm`,{size:3,anchor:'start',color:'#4c5a54'}));
  // scale bar
  const sbY=27;
  parts.push(`<rect x="${x0}" y="${sbY}" width="50" height="2.2" fill="none" stroke="${INK}" stroke-width="0.25"/>`);
  for(let i=0;i<5;i++) parts.push(`<rect x="${x0+i*10}" y="${sbY}" width="10" height="2.2" fill="${i%2?'#fff':INK}"/>`);
  parts.push(text(x0+53,sbY+2.1,'比例尺核對：此黑白條應為 50 mm',{size:2.8,anchor:'start',color:'#4c5a54'}));

  // ① stock
  y=44;
  parts.push(text(x0,y,'① 原木料下料：在總長上畫切割線，分出 A 與 B',{size:3.8,anchor:'start',weight:700}));
  let yr=y+9;
  parts.push(`<rect x="${x0}" y="${yr}" width="${L1}" height="${W}" fill="#f4e4c6" stroke="${INK}" stroke-width="0.4"/>`);
  parts.push(`<rect x="${x0+L1}" y="${yr}" width="${L2}" height="${W}" fill="#ead2ad" stroke="${INK}" stroke-width="0.4"/>`);
  parts.push(line(x0+L1,yr-5,x0+L1,yr+W+5,CUT,0.45,'2.5 1.2'));
  parts.push(text(x0+L1,yr-6,'切割線 CUT',{size:2.8,color:CUT,weight:700}));
  parts.push(text(x0+L1/2,yr+W/2+1.4,'A 背板',{size:3.8,weight:700}));
  parts.push(text(x0+L1+L2/2,yr+W/2+1.4,'B 底座',{size:3.8,weight:700}));
  parts.push(hdim(x0,x0+L1,yr+W+8,yr+W,fm(L1)));
  parts.push(hdim(x0+L1,x0+Lt,yr+W+8,yr+W,fm(L2)));
  parts.push(hdim(x0,x0+Lt,yr+W+15,yr+W,`總長 ${fm(Lt)}`));
  parts.push(vdim(yr,yr+W,x0-7,x0,fm(W)));
  parts.push(text(x0,yr+W+22,'註：下鋸時鋸路會損耗約 2–3 mm，請沿切割線的「B 側」下鋸，或在總長預留鋸路。',{size:2.7,anchor:'start',color:'#4c5a54'}));
  y=yr+W+32;

  const board=(title,L,np,fill,leftTxt,rightTxt,name,extra)=>{
    parts.push(text(x0,y,title,{size:3.8,anchor:'start',weight:700}));
    const yr=y+22, l=np-T/2, r=np+T/2;
    const pts=[[0,0],[l,0],[l,W/2],[r,W/2],[r,0],[L,0],[L,W],[0,W]].map(p=>`${x0+p[0]},${yr+p[1]}`).join(' ');
    parts.push(`<polygon points="${pts}" fill="${fill}" stroke="${INK}" stroke-width="0.45"/>`);
    parts.push(`<rect x="${x0+l}" y="${yr}" width="${T}" height="${W/2}" fill="url(#hatch)" stroke="${CUT}" stroke-width="0.3" stroke-dasharray="1.2 0.8"/>`);
    parts.push(line(x0+np,yr-3,x0+np,yr+W+3,CL,0.3,'4 1 0.8 1'));
    parts.push(line(x0+l-2,yr+W/2,x0+r+2,yr+W/2,CL,0.25,'1 0.7'));
    parts.push(hdim(x0,x0+l,yr-6,yr,fm(np-T/2)));
    parts.push(hdim(x0+l,x0+r,yr-6,yr,`T ${fm(T)}`));
    parts.push(hdim(x0+r,x0+L,yr-6,yr,fm(L-np-T/2)+(extra||'')));
    parts.push(hdim(x0,x0+np,yr-13,yr,`槽中心 ${fm(np)}`,CL));
    parts.push(hdim(x0,x0+L,yr+W+8,yr+W,`${name} 全長 ${fm(L)}`));
    parts.push(vdim(yr,yr+W,x0+L+8,x0+L,fm(W)));
    parts.push(vdim(yr,yr+W/2,x0+r+5,x0+r,`深 ${fm(W/2)}`,CUT));
    parts.push(text(x0+1.5,yr+W-2,leftTxt,{size:2.6,anchor:'start',color:'#4c5a54'}));
    parts.push(text(x0+L-1.5,yr+W-2,rightTxt,{size:2.6,anchor:'end',color:'#4c5a54'}));
    const nameX=(L-r)>30?x0+(r+L)/2:x0+L/2;
    parts.push(text(nameX,yr+W/2+3.2,name,{size:3.6,weight:700,color:'#6a4a2a'}));
    y=yr+W+20;
  };
  board(`② 板材 A（背板）：槽口寬 T = ${fm(T)}、深 W/2 = ${fm(W/2)}`,L1,a,'#f4e4c6','◀ 底端（接觸桌面）','頂端 ▶','A 背板');
  board(`③ 板材 B（底座）：組裝時翻轉，槽口與 A 的槽口相對插入`,L2,b,'#ead2ad','◀ 後端（接觸桌面）','前端（托板唇口）▶','B 底座',' 唇口');

  // ④ side view
  parts.push(text(x0,y,`④ 側視組裝圖（1:1）：背板傾斜 θ = ${P.theta}°`,{size:3.8,anchor:'start',weight:700}));
  const sidePts=[...m.cA,...m.cB,...m.phonePts];
  const zmin=Math.min(...sidePts.map(p=>p.z)), zmax=Math.max(...sidePts.map(p=>p.z)), ymax=Math.max(...sidePts.map(p=>p.y));
  const ox=x0+6, gy=y+10+ymax*k;
  const SX=z=>ox+(z-zmin)*k, SY=yy=>gy-yy*k;
  const poly=(c,fill)=>{const o=[c[0],c[1],c[3],c[2]]; return `<polygon points="${o.map(p=>`${SX(p.z)},${SY(p.y)}`).join(' ')}" fill="${fill}" stroke="${INK}" stroke-width="0.4"/>`;};
  parts.push(line(ox-6,gy,SX(zmax)+12,gy,INK,0.5));
  for(let gx=ox-6;gx<SX(zmax)+12;gx+=3) parts.push(line(gx,gy,gx-2,gy+2,'#8a9690',0.2));
  parts.push(poly(m.cB,'#ead2ad'), poly(m.cA,'#f4e4c6'));
  const pc=[m.crotch,m.crotch.clone().addScaledVector(m.nA,m.pt),m.crotch.clone().addScaledVector(m.nA,m.pt).addScaledVector(m.dA,m.ph),m.crotch.clone().addScaledVector(m.dA,m.ph)];
  parts.push(`<polygon points="${pc.map(p=>`${SX(p.z)},${SY(p.y)}`).join(' ')}" fill="none" stroke="#4c5a54" stroke-width="0.3" stroke-dasharray="1.5 1"/>`);
  parts.push(text(SX(pc[3].z)+2,SY(pc[3].y)+3,'手機',{size:2.6,anchor:'start',color:'#4c5a54'}));
  // angle arc at A's front contact (back face of A meets ground)
  const gA=m.cA[0], R=12, s=m.s, c=m.c;
  const gxp=SX(gA.z), gyp=SY(gA.y);
  parts.push(`<path d="M ${gxp-R} ${gyp} A ${R} ${R} 0 0 1 ${gxp-R*c} ${gyp-R*s}" fill="none" stroke="${CUT}" stroke-width="0.35"/>`);
  const mid=(180+P.theta/2)*DEG;
  parts.push(text(gxp+Math.cos(mid)*(R+4),gyp+Math.sin(mid)*(R+4)+1,`θ ${P.theta}°`,{size:3,color:CUT,weight:700,bg:true}));
  // CoG
  const cg=m.cogAll;
  parts.push(line(SX(cg.z),SY(cg.y),SX(cg.z),gy,CUT,0.25,'1 0.8'));
  parts.push(`<circle cx="${SX(cg.z)}" cy="${SY(cg.y)}" r="1.3" fill="${CUT}"/>`);
  parts.push(text(SX(cg.z)+2,SY(cg.y)-1.5,'複合重心',{size:2.6,anchor:'start',color:CUT,bg:true}));
  parts.push(hdim(SX(m.zb),SX(m.zf),gy+7,gy,`支撐範圍 ${fm((m.zf-m.zb)*k)}`));
  parts.push(text(SX(zmax)+10,gy-2,'前 ▶',{size:2.8,anchor:'end',color:'#4c5a54'}));
  y=gy+20;

  // notes
  const notes=['劃線與加工提示：',
    '1. 先用直角尺沿槽中心線（藍色點劃線）向兩側各量 T/2，畫出槽口兩邊；再用劃線規畫出深度 W/2。',
    '2. 斜線區為要鑿除的部分。先在線內側鋸兩刀至深度線，再用鑿刀清底，最後銼修至與另一塊板緊配。',
    '3. 槽口寬度等於木板厚度 T；若木板實際厚度與輸入不同，請以實測厚度為準重新設定。',
    '4. 列印 SVG 時選擇「實際大小 / 100%」，並用上方 50 mm 比例尺核對。'];
  notes.forEach((t,i)=>parts.push(text(x0,y+i*5,t,{size:i?2.8:3.2,anchor:'start',weight:i?400:700,color:i?'#33403a':INK})));
  y+=notes.length*5+8;

  const PW=Math.max(x0+Lt+22,SX(zmax)+26,200), PH=y;
  return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${PW.toFixed(1)}mm" height="${PH.toFixed(1)}mm" viewBox="0 0 ${PW.toFixed(2)} ${PH.toFixed(2)}" font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, Heiti TC, sans-serif"><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="1.6" height="1.6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="1.6" stroke="${CUT}" stroke-width="0.3"/></pattern></defs><rect x="0" y="0" width="${PW.toFixed(2)}" height="${PH.toFixed(2)}" fill="#fff"/>${parts.join('')}</svg>`,PW,PH};
}
let bpCache=null;
function svgImage(svg){return new Promise((res,rej)=>{const img=new Image(); img.onload=()=>res(img); img.onerror=rej; img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
async function openBlueprint(){
  bpCache=buildBlueprintSVG();
  const modal=$('#bp-modal'); modal.hidden=false;
  const wrap=$('#bp-wrap'), cv=$('#bp-canvas');
  const cw=Math.max(320,wrap.clientWidth-32), scale=cw/bpCache.PW, ch=bpCache.PH*scale, dpr=window.devicePixelRatio||1;
  cv.width=Math.round(cw*dpr); cv.height=Math.round(ch*dpr); cv.style.width=cw+'px'; cv.style.height=ch+'px';
  const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  try{const img=await svgImage(bpCache.svg); ctx.drawImage(img,0,0,cv.width,cv.height);}catch(e){ctx.fillStyle='#cf3b2c'; ctx.font='16px sans-serif'; ctx.fillText('圖紙預覽失敗，請直接導出 SVG。',20,40);}
  $('#bp-close').focus();
}
function download(url,name){const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();}
function fileStem(){return `手機座劃線圖_${f1(P.Ltotal)}x${f1(P.W)}x${f1(P.T)}cm_${P.theta}deg`;}
$('#bp-svg').addEventListener('click',()=>{
  const blob=new Blob([bpCache.svg],{type:'image/svg+xml'}); const url=URL.createObjectURL(blob);
  download(url,fileStem()+'.svg'); setTimeout(()=>URL.revokeObjectURL(url),4000);
});
$('#bp-png').addEventListener('click',async()=>{
  const pxmm=300/25.4, cv=document.createElement('canvas');
  cv.width=Math.round(bpCache.PW*pxmm); cv.height=Math.round(bpCache.PH*pxmm);
  const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  const img=await svgImage(bpCache.svg); ctx.drawImage(img,0,0,cv.width,cv.height);
  cv.toBlob(b=>{const url=URL.createObjectURL(b); download(url,fileStem()+'_300dpi.png'); setTimeout(()=>URL.revokeObjectURL(url),4000);},'image/png');
});
$('#bp-close').addEventListener('click',()=>{$('#bp-modal').hidden=true;});
$('#bp-modal').addEventListener('click',e=>{if(e.target.id==='bp-modal') $('#bp-modal').hidden=true;});
document.addEventListener('keydown',e=>{if(e.key==='Escape') $('#bp-modal').hidden=true;});

/* ---------- wiring ---------- */
btnPhone.addEventListener('click',()=>{ (S.phone==='on')?removePhone():(S.phone==='off'||S.phone==='slipped')?placePhone():null; });
$('#btn-reset').addEventListener('click',()=>{
  const had=S.phone; resetDynamic(true); S.anim=null;
  if(had==='on'){S.phone='on'; phone.visible=true; const p=phonePose(); phone.position.copy(p.pos); phone.quaternion.copy(p.q); afterPlaced();}
  else {S.phone='off'; phone.visible=false; checkStatic();}
  setPhoneBtn(); updateMarkers(); updateStatusNow();
});
$('#btn-test').addEventListener('click',()=>{
  if(S.phone==='off'||S.phone==='slipped') placePhone();
  const sec=$('#report-sec'); sec.scrollIntoView({behavior:'smooth',block:'start'});
  sec.classList.remove('flash'); void sec.offsetWidth; sec.classList.add('flash');
});
$('#btn-bp').addEventListener('click',openBlueprint);
$('#btn-push').addEventListener('click',()=>{
  if(S.anim||S.tip||S.phone==='slipped'||S.phone==='flipping') return;
  startTip({front:'B',back:'F',left:'R',right:'L'}[P.windDir]);
});
$('#t-slow').addEventListener('change',e=>{S.slow=e.target.checked;});
$('#btn-auto').addEventListener('click',()=>{
  const th=P.theta*DEG, s=Math.sin(th), c=Math.cos(th), T=P.T, L2=P.Ltotal-P.L1;
  const lipTarget=Math.max(1.2,P.pT*1.6);
  const b=L2-T/2-lipTarget;
  let a=(b*c-T/2*(c-s))/s;
  P.a=Math.round(a*10)/10; constrain(); syncControls(); rebuild();
});
$('#sel-wood').addEventListener('change',e=>{P.density=+e.target.value; rebuild();});
function seg(id,key){
  const el=$(id);
  el.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    P[key]=b.dataset.v; if(key==='orient') rebuild();
  }));
}
seg('#seg-orient','orient'); seg('#seg-wind','windDir');
$('#t-cog').addEventListener('change',e=>{P.showCoG=e.target.checked; updateMarkers();});
$('#t-sup').addEventListener('change',e=>{P.showSupport=e.target.checked; updateMarkers();});
$('#t-lab').addEventListener('change',e=>{P.showLabels=e.target.checked; standGroup.children.forEach(o=>{if(o.isSprite)o.visible=P.showLabels;});});

constrain(); syncControls(); updateEnvNotes();
rebuild(); resize();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
